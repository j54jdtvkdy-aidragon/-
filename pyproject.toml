[project]
name = "themelens"
version = "0.1.0"
description = "指定テーマについて、Web・ニュース・SNS・学術・動画など複数媒体から情報を集めて自動分析するCLI"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  "yt-dlp>=2024.8",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
themelens = "themelens.cli:main"

[tool.setuptools]
packages = ["themelens", "themelens.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
